<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark light" />
  <title>Passwords</title>
  <style>
    :root {
      --accent: #ff5a36;
      --bg: #121316;
      --ink: #f2f0ec;
      --muted: #8d8a84;
      --panel: #1c1e24;
      --line: #2c2f36;
      --field: #121316;
      --button: #2a2d34;
      --error: #ff8d78;
      --go-ink: #1a0d09;
    }
    html[data-theme="light"] {
      --bg: #f4f2ee;
      --ink: #1c1a18;
      --muted: #6e6b66;
      --panel: #ffffff;
      --line: #d0cbc2;
      --field: #ffffff;
      --button: #d8d3ca;
      --error: #c2410c;
    }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(720px, calc(100% - 48px)); margin: 48px auto 64px; }
    h1 { font-weight: 600; font-size: 28px; letter-spacing: -0.04em; margin: 0 0 8px; }
    h1 span { color: var(--accent); }
    p.lead, .hint, .error { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .error { color: var(--error); min-height: 18px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 16px; }
    label { display: flex; gap: 10px; align-items: center; margin: 8px 0; cursor: pointer; }
    input[type="password"], input[type="text"], input[type="search"] {
      width: 100%; box-sizing: border-box; background: var(--field); color: inherit; border: 1px solid var(--line);
      border-radius: 10px; font: inherit; font-size: 14px; padding: 12px 14px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { background: var(--button); color: inherit; border: 0; border-radius: 9px; padding: 10px 14px; font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--go-ink); font-weight: 650; }
    button.quiet { background: transparent; color: var(--muted); }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
    .toolbar input { flex: 1; }
    ul { list-style: none; padding: 0; margin: 14px 0 0; }
    li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .site { font-weight: 600; }
    .user { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .secret { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; margin-top: 6px; }
    .actions { display: flex; gap: 6px; }
    .empty { color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Pass<span>words</span></h1>
    <p id="lead" class="lead">Saved on this computer only.</p>
    <p id="error" class="error"></p>

    <section id="setup" class="card hidden">
      <p id="setup-hint" class="hint">Choose how this vault opens.</p>
      <label id="setup-login-label"><input type="radio" name="setup-mode" value="windows" checked /> This computer's sign-in</label>
      <label><input type="radio" name="setup-mode" value="cove" /> A password only for Cove</label>
      <input id="setup-pass" type="password" placeholder="Password" autocomplete="new-password" />
      <input id="setup-again" class="hidden" type="password" placeholder="Type it again" autocomplete="new-password" style="margin-top:8px" />
      <div class="row"><button id="setup-go" class="primary" type="button">Create vault</button></div>
    </section>

    <section id="unlock" class="card hidden">
      <div id="unlock-choice">
        <label id="unlock-login-label"><input type="radio" name="unlock-mode" value="windows" checked /> This computer's sign-in</label>
        <label><input type="radio" name="unlock-mode" value="cove" /> Cove password</label>
      </div>
      <input id="unlock-pass" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px" />
      <div class="row">
        <button id="unlock-go" class="primary" type="button">Unlock</button>
        <button id="touch-go" class="hidden" type="button">Unlock with Touch ID</button>
      </div>
    </section>

    <section id="list" class="hidden">
      <div class="toolbar">
        <input id="query" type="search" placeholder="Search by site, email, or username" autocomplete="off" spellcheck="false" />
        <button id="lock" type="button">Lock</button>
      </div>
      <p id="windows-offer" class="hint hidden">You can also open this vault with this computer's sign-in next time.</p>
      <div id="windows-form" class="row hidden">
        <input id="windows-pass" type="password" placeholder="Sign-in password" autocomplete="current-password" />
        <button id="windows-go" type="button">Allow</button>
      </div>
      <ul id="items"></ul>
      <p id="none" class="empty hidden">Nothing matches.</p>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const theme = (params.get("theme") || "dark").toLowerCase() === "light" ? "light" : "dark";
    document.documentElement.dataset.theme = theme;
    const themeMeta = document.querySelector('meta[name="color-scheme"]');
    if (themeMeta) themeMeta.content = theme;
    const accent = params.get("accent");
    if (accent) document.documentElement.style.setProperty("--accent", "#" + accent.replace("#", ""));
    let entries = [];
    let revealed = new Set();
    let platform = "mac";
    let touchId = false;

    function machine() { return platform === "mac" ? "Mac" : "PC"; }

    function mode(name) {
      const picked = document.querySelector(`input[name="${name}"]:checked`);
      return picked ? picked.value : "cove";
    }

    function show(which) {
      $("setup").classList.toggle("hidden", which !== "setup");
      $("unlock").classList.toggle("hidden", which !== "unlock");
      $("list").classList.toggle("hidden", which !== "list");
    }

    function paintLabels() {
      const name = machine();
      $("lead").textContent = `Saved on this ${name} only. Unlock with Touch ID, this ${name}'s sign-in, or a Cove password.`;
      if (platform !== "mac") $("lead").textContent = `Saved on this ${name} only. Unlock with this ${name}'s Windows sign-in, or a Cove password.`;
      $("setup-hint").textContent = platform === "mac"
        ? `Choose how this vault opens. A Cove password still works if this Mac's sign-in password cannot be checked.`
        : `Choose how this vault opens. Windows sign-in stores the key with your Windows user account.`;
      $("setup-login-label").lastChild.textContent = ` This ${name}'s sign-in password`;
      $("unlock-login-label").lastChild.textContent = ` This ${name}'s sign-in password`;
      $("windows-offer").textContent = `You can also open this vault with this ${name}'s sign-in password next time.`;
      $("windows-pass").placeholder = `This ${name}'s sign-in password`;
      $("setup-pass").placeholder = mode("setup-mode") === "windows" && platform === "windows"
        ? "Optional on Windows"
        : "Password";
      $("touch-go").classList.toggle("hidden", !touchId);
    }

    function paint() {
      const q = $("query").value.trim().toLowerCase();
      const list = $("items");
      list.replaceChildren();
      const matches = entries.filter((e) => {
        const host = (e.host || "").toLowerCase();
        const user = (e.username || "").toLowerCase();
        return !q || host.includes(q) || user.includes(q);
      });
      $("none").classList.toggle("hidden", matches.length > 0);
      for (const entry of matches) {
        const li = document.createElement("li");
        const text = document.createElement("div");
        const open = revealed.has(entry.id);
        text.innerHTML = `<div class="site"></div><div class="user"></div><div class="secret"></div>`;
        text.querySelector(".site").textContent = entry.host || "Saved login";
        text.querySelector(".user").textContent = entry.username || "No username";
        text.querySelector(".secret").textContent = open ? entry.password : "••••••••";
        const actions = document.createElement("div");
        actions.className = "actions";
        const showBtn = document.createElement("button");
        showBtn.type = "button";
        showBtn.textContent = open ? "Hide" : "Show";
        showBtn.addEventListener("click", () => {
          if (revealed.has(entry.id)) revealed.delete(entry.id);
          else revealed.add(entry.id);
          paint();
        });
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy";
        copy.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(entry.password || ""); copy.textContent = "Copied"; }
          catch { copy.textContent = "Copy failed"; }
        });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "quiet";
        del.textContent = "Delete";
        del.addEventListener("click", () => {
          if (!window.chrome?.webview) return;
          chrome.webview.postMessage({ kind: "vault-delete", id: entry.id });
        });
        actions.append(showBtn, copy, del);
        li.append(text, actions);
        list.append(li);
      }
    }

    function apply(state) {
      $("error").textContent = state.error || "";
      platform = state.platform === "windows" ? "windows" : "mac";
      touchId = !!state.touchId;
      paintLabels();
      if (!state.exists) { show("setup"); return; }
      if (!state.unlocked) {
        show("unlock");
        $("unlock-choice").classList.toggle("hidden", !state.windows);
        $("touch-go").classList.toggle("hidden", !touchId);
        return;
      }
      entries = state.entries || [];
      show("list");
      const offer = !state.windows;
      $("windows-offer").classList.toggle("hidden", !offer);
      $("windows-form").classList.toggle("hidden", !offer);
      if (platform === "windows") $("windows-pass").classList.toggle("hidden", true);
      paint();
    }

    document.querySelectorAll('input[name="setup-mode"]').forEach((input) => {
      input.addEventListener("change", () => {
        $("setup-again").classList.toggle("hidden", mode("setup-mode") !== "cove");
        paintLabels();
      });
    });

    $("setup-go").addEventListener("click", () => {
      const password = $("setup-pass").value;
      if (mode("setup-mode") === "cove" && password !== $("setup-again").value) {
        $("error").textContent = "Those passwords don't match.";
        return;
      }
      chrome.webview?.postMessage({ kind: "vault-setup", mode: mode("setup-mode"), password });
    });

    $("unlock-go").addEventListener("click", () => {
      const chosen = $("unlock-choice").classList.contains("hidden") ? "cove" : mode("unlock-mode");
      chrome.webview?.postMessage({ kind: "vault-unlock", mode: chosen, password: $("unlock-pass").value });
      $("unlock-pass").value = "";
    });

    $("touch-go").addEventListener("click", () => {
      chrome.webview?.postMessage({ kind: "vault-unlock", mode: "touchid", password: "" });
    });

    $("lock").addEventListener("click", () => {
      revealed = new Set();
      entries = [];
      chrome.webview?.postMessage({ kind: "vault-lock" });
    });

    $("query").addEventListener("input", paint);

    $("windows-go").addEventListener("click", () => {
      chrome.webview?.postMessage({ kind: "vault-windows", password: $("windows-pass").value });
      $("windows-pass").value = "";
    });

    if (window.chrome?.webview) {
      chrome.webview.addEventListener("message", (e) => apply(e.data || {}));
      chrome.webview.postMessage({ kind: "vault-status" });
    } else {
      $("error").textContent = "Open this page inside Cove.";
    }
  </script>
</body>
</html>
